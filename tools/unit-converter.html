<style>
/* TOMfit tool style — shared by all TOMfit tools (BMI calculator, unit converter, ...) */
:root{
  --blue:#0050B3; --blue-d:#003E8C; --yellow:#FFC800; --yellow-l:#FFF4CC;
  --bg:#EEF4FB; --card:#FFFFFF; --fg:#1F3B5C; --muted:#4F6A88; --line:#D3E0EE; --track:#E4EDF7;
  --under:#5AA9E6; --healthy:#3FAE78; --over:#F0B429; --obese:#E5624F;
  --font:"Lexend",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.card{max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;
  overflow:hidden;box-shadow:0 6px 24px rgba(0,80,179,.08)}
.brand{background:var(--blue);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:34px;display:block;border-radius:4px}
.brand .tool{color:#fff;font-weight:600;font-size:1rem;letter-spacing:.02em;text-align:right}
.inner{padding:22px 22px 24px;display:grid;gap:22px}
h1{margin:0;font-size:1.6rem;font-weight:700;color:var(--blue);line-height:1.2}
.sub{margin:-14px 0 0;color:var(--muted);font-size:.95rem}
.pill{display:flex;background:var(--track);border-radius:999px;padding:4px}
.pill button{flex:1;font:600 1rem var(--font);border:none;background:none;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.pill button[aria-pressed="true"]{background:var(--blue);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
label,.lbl{font-size:.85rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.num{display:flex;align-items:baseline;gap:6px}
.num input{width:4.4ch;font:600 1.6rem var(--font);color:var(--fg);background:none;border:none;border-bottom:3px solid var(--line);
  text-align:right;padding:0 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num input:focus{outline:none;border-color:var(--blue)}
.num span{color:var(--muted);font-size:1rem}
input[type=range]{width:100%;accent-color:var(--blue);height:28px;margin:0}
.tip{margin:0;padding:14px 16px;border-radius:14px;background:var(--yellow-l);border-left:5px solid var(--yellow);font-size:1rem;line-height:1.5}
.about{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:10px}
.about h2{margin:0;font-size:1.15rem;font-weight:600;color:var(--blue)}
.about p{margin:0;font-size:.95rem;line-height:1.6;color:var(--muted)}
.foot{text-align:center;font-size:.8rem;color:var(--muted);margin-top:14px}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cats button{font:600 .92rem var(--font);color:var(--blue);background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:8px 4px;min-height:60px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:background .2s,color .2s,border-color .2s;line-height:1.2}
.cats button:hover{border-color:var(--blue)}
.cats button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.conv{display:grid;gap:10px}
.box{border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.box.m{border-color:var(--blue)}
.box.i{border-color:var(--yellow)}
.box .lbl{display:block}
.box .uname{font-size:.95rem;color:var(--fg);font-weight:600}
.box .num input{width:5.2ch}
.box .num input.sm{width:2.8ch}
.swap{justify-self:center;width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;margin:-4px 0}
.extra{margin:0;text-align:center;color:var(--fg);font-size:1rem}
.extra b{color:var(--blue)}
.guide h2{margin:0 0 8px;font-size:1.1rem;color:var(--blue)}
.guide table{width:100%;border-collapse:collapse;font-size:1rem;font-variant-numeric:tabular-nums}
.guide th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 8px 6px;font-weight:600}
.guide td{padding:8px;border-top:1px solid var(--line)}
.guide td:first-child{font-weight:600}
.guide td.note{color:var(--muted);font-size:.9rem}
[hidden]{display:none!important}
@media (max-width:380px){.cats button{font-size:.85rem;padding:10px 4px}}
</style>

 {id:"kb",label:"Kettlebell",m:["Kilograms","kg"],i:["Pounds","lb"],to:x=>x*LB,from:y=>y/LB,dm:1,di:1,start:8,
  extra:kg=>`Nearest US bell: <b>${near(US_BELLS,kg*LB)} lb</b> · nearest metric bell: <b>${near(KG_BELLS,kg)} kg</b>`,
  guide:[[4,""],[6,""],[8,""],[12,""],[16,""],[20,""],[24,""]],gx:kg=>`US bell ${near(US_BELLS,kg*LB)} lb`,
  tip:"Metric bells come in 2–4 kg steps, US bells in 5 lb steps, so the nearest real bell is shown."},
 {id:"sugar",label:"Blood sugar",m:["Millimoles per litre","mmol/L"],i:["Milligrams per decilitre","mg/dL"],to:x=>x*18.016,from:y=>y/18.016,dm:1,di:0,start:5.5,
  guide:[[4.0,"low end of normal"],[5.5,"normal fasting is below 5.6"],[6.0,"fasting 5.6–6.9: raised"],[7.0,"fasting 7.0+: high"],[7.8,"2 h after a meal: aim below"],[11.1,"very high"]],
  tip:"The UK and Europe use mmol/L; the US uses mg/dL. Always check the unit on your meter or test result."},
 {id:"chol",label:"Cholesterol",m:["Millimoles per litre","mmol/L"],i:["Milligrams per decilitre","mg/dL"],to:x=>x*38.67,from:y=>y/38.67,dm:1,di:0,start:5,
  guide:[[3.0,"LDL: common target below 3"],[4.0,""],[5.0,"total: UK target below 5"],[6.0,""],[7.0,"high"]],
  tip:"This conversion is for total, LDL and HDL cholesterol. Triglycerides use a different number (× 88.6)."}
];
let cur=C[0], kgVal=null;
const cats=$("cats");
C.forEach(c=>{const b=document.createElement("button");b.type="button";b.textContent=c.label;b.dataset.id=c.id;
  b.onclick=()=>pick(c.id);cats.appendChild(b)});
function pick(id){
  cur=C.find(c=>c.id===id);
  try{localStorage.setItem("convCat",id)}catch(e){}
  [...cats.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===id));
  $("mName").textContent=cur.m[0];$("mU").textContent=cur.m[1];
  $("iName").textContent=cur.i[0];$("iU").textContent=cur.i[1];
  $("iWrap").hidden=!!cur.ft;$("ftWrap").hidden=!cur.ft;
  $("gM").textContent=cur.m[1]||cur.m[0];$("gI").textContent=cur.ft?"ft / in":cur.i[1];
  $("gBody").innerHTML=cur.guide.map(([v,n])=>{
    const iv=cur.ft?(()=>{const[f,i]=ftin(v);return `${f} ft ${i} in`})():fmt(cur.to(v),cur.di);
    const note=cur.gx?cur.gx(v):n;
    return `<tr><td>${fmt(v,cur.dm)}</td><td>${iv}</td><td class="note">${note}</td></tr>`}).join("");
  $("tip").textContent=cur.tip;
  setM(cur.start);
}
function setM(v,skip){
  if(skip!=="m")$("mIn").value=fmt(v,cur.dm).replace(/,/g,"");
  if(cur.ft){const[f,i]=ftin(v);if(skip!=="i"){$("ftIn").value=f;$("inIn").value=i}}
  else if(skip!=="i")$("iIn").value=fmt(cur.to(v),cur.di).replace(/,/g,"");
  $("extra").innerHTML=cur.extra?cur.extra(v):"";$("extra").hidden=!cur.extra;
}
$("mIn").addEventListener("input",e=>{const v=parseFloat(e.target.value);if(isFinite(v))setM(v,"m");else{$("iIn").value="";$("extra").textContent=""}});
$("iIn").addEventListener("input",e=>{const v=parseFloat(e.target.value);if(isFinite(v))setM(cur.from(v),"i");else{$("mIn").value="";$("extra").textContent=""}});
function fromFt(){const f=parseFloat($("ftIn").value)||0,i=parseFloat($("inIn").value)||0;if(f||i)setM((f*12+i)*2.54,"i")}
$("ftIn").addEventListener("input",fromFt);$("inIn").addEventListener("input",fromFt);
let start="weight";try{start=localStorage.getItem("convCat")||"weight"}catch(e){}
pick(C.some(c=>c.id===start)?start:"weight");
</script>
</body>
</html>

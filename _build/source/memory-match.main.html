<main id="main" class="pg" style="padding-top:26px;gap:14px">
  <h1 class="pzh">Memory Match – find the matching flags</h1>
  <div class="mm">
    <section class="mm-game" aria-label="Memory Match game">
      <div class="mm-bar">
        <div class="mm-lv" role="group" aria-label="Choose a level"><button type="button" data-level="easy" aria-pressed="true">Easy<small>12 cards</small></button><button type="button" data-level="medium" aria-pressed="false">Medium<small>16 cards</small></button><button type="button" data-level="hard" aria-pressed="false">Hard<small>20 cards</small></button></div>
        <div class="mm-st"><span>Moves: <b id="mm-moves">0</b></span><span>Pairs: <b id="mm-pairs">0</b></span></div>
      </div>
      <div id="mm-board" class="mm-board" aria-label="Cards"></div>
      <div id="mm-done" class="mm-done" hidden><p id="mm-donetxt"></p><button type="button" id="mm-again" class="btn y">Play again</button></div>
      <p id="mm-live" class="small" role="status" aria-live="polite" style="margin:0;min-height:1em"></p>
    </section>
  </div>
  <h2 class="pzh pz2">Mobile app for all your health needs</h2>
  <!--FEAT-->
  <div class="ibshop" style="margin-top:26px;gap:16px;flex-wrap:wrap"><a class="btn y" href="/shop">Visit our Shop</a><a class="btn o" href="/puzzles">← All puzzles</a></div>
</main>
<script src="/assets/memory-match.js?v=100flags" defer></script>
